<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); padding: 0; font-family: var(--font-body); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; height: 240px; }
  .cell { display: flex; align-items: center; justify-content: center; }
  .light { background: var(--cream); }
  .tint { background: var(--gradient-sunrise); }
  img { height: 168px; width: auto; }
  .tag { position: absolute; font-size: 11px; font-weight: 700; color: var(--color-text-muted); margin: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cell light"><span class="tag">on cream</span><img src="../assets/logo-chudo.png" alt="Чудо Садик"></div>
    <div class="cell tint"><span class="tag">on sunrise tint</span><img src="../assets/logo-chudo.png" alt="Чудо Садик"></div>
  </div>
</body>
</html>
