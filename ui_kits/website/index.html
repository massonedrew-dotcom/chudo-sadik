<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  html, body { margin: 0; background: var(--cream); }

<body>

<script type="text/babel" src="Common.jsx" data-presets="react"></script>

<script type="text/babel" src="App.jsx" data-presets="react"></script>

<script type="text/babel" data-presets="react">
  function mount() {
    const ns = window.DesignSystem_52b7c1;
    if (!ns || !window.App) { setTimeout(mount, 60); return; }
    const App = window.App;
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // Keep Lucide icons rendered across React re-renders
    const refresh = () => window.lucide && window.lucide.createIcons();
    refresh();
    let t;
    const obs = new MutationObserver(() => { clearTimeout(t); t = setTimeout(refresh, 30); });
    obs.observe(document.getElementById('root'), { childList: true, subtree: true });
  }
  mount();
</script>
</body>
